name: Public video smoke test
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-video:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install CPU tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --disable-pip-version-check 'torch==2.9.1' 'torchvision==0.24.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check -r scripts/requirements-video.txt
      - name: Download and analyze a real public YouTube video
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          DO_NOT_TRACK: '1'
        run: |
          python scripts/analyze_video.py --url 'https://www.youtube.com/watch?v=jNQXAC9IVRw' --output "$RUNNER_TEMP/public-video-test"
          python scripts/check_smoke.py "$RUNNER_TEMP/public-video-test/report.json"
      # Deliberately no upload-artifact or cache: the production path must not
      # accidentally publish personal video links, frames or transcripts.
