name: Chuck Inbox regression tests
on:
  pull_request:
  push:
    branches: [main, feature/video-analysis]
permissions:
  contents: read
jobs:
  configuration-audit:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/feature/video-analysis' &&
      github.repository == 'mezentsevaleksey-dotcom/chuck-inbox'
    runs-on: ubuntu-24.04
    steps:
      - name: Report presence only, never secret values
        env:
          HAS_RESEND_API_KEY: ${{ secrets.RESEND_API_KEY != '' }}
          HAS_CHUCK_INBOX_EMAIL: ${{ secrets.CHUCK_INBOX_EMAIL != '' }}
          HAS_START_AT: ${{ vars.VIDEO_ANALYSIS_START_AT != '' }}
          ENABLED: ${{ vars.VIDEO_ANALYSIS_ENABLED == 'true' }}
        run: |
          python - <<'PY'
          import os
          for name in ('HAS_RESEND_API_KEY', 'HAS_CHUCK_INBOX_EMAIL', 'HAS_START_AT', 'ENABLED'):
              print(name + '=' + os.environ[name])
          PY
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/webhook.test.mjs
  public-smoke:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/feature/video-analysis' &&
      github.repository == 'mezentsevaleksey-dotcom/chuck-inbox' &&
      github.event.repository.private == false
    uses: ./.github/workflows/video-smoke.yml
