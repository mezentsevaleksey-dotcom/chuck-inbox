name: Chuck Inbox automatic video analysis
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Check access, process inbox, or test the fixed public video
        required: true
        default: check
        type: choice
        options: [check, inbox, public-smoke]
permissions:
  contents: read
concurrency:
  group: chuck-video-analysis
  cancel-in-progress: false
jobs:
  inbox:
    if: >-
      github.repository == 'mezentsevaleksey-dotcom/chuck-inbox' &&
      github.event.repository.private == false &&
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'schedule' && vars.VIDEO_ANALYSIS_ENABLED == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode != 'public-smoke'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check or select new links (no content in logs)
        id: plan
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CHUCK_INBOX_EMAIL: ${{ secrets.CHUCK_INBOX_EMAIL }}
          VIDEO_ANALYSIS_START_AT: ${{ vars.VIDEO_ANALYSIS_START_AT }}
          MODE: ${{ inputs.mode || 'inbox' }}
        run: |
          if [ "$MODE" = check ]; then
            python scripts/inbox_worker.py check
          else
            python scripts/inbox_worker.py plan --plan "$RUNNER_TEMP/chuck-plan.json"
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.plan.outputs.has_work == 'true'
        with:
          node-version: '22'
      - name: Install CPU tools only when a new video is waiting
        if: steps.plan.outputs.has_work == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --disable-pip-version-check 'torch==2.9.1' 'torchvision==0.24.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check -r scripts/requirements-video.txt
      - name: Analyze locally and deliver via the existing email service
        if: steps.plan.outputs.has_work == 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CHUCK_INBOX_EMAIL: ${{ secrets.CHUCK_INBOX_EMAIL }}
          VIDEO_ANALYSIS_START_AT: ${{ vars.VIDEO_ANALYSIS_START_AT }}
        run: python scripts/inbox_worker.py run --plan "$RUNNER_TEMP/chuck-plan.json"
      - name: Remove private temporary data
        if: always()
        run: rm -f "$RUNNER_TEMP/chuck-plan.json"
  public-smoke:
    if: >-
      github.repository == 'mezentsevaleksey-dotcom/chuck-inbox' &&
      github.event.repository.private == false &&
      github.event_name == 'workflow_dispatch' && inputs.mode == 'public-smoke'
    uses: ./.github/workflows/video-smoke.yml
